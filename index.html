        <h2>About</h2>
        <p>
          I design and build production-grade systems end-to-end: from clean architecture
          foundations to cloud deployment. My current focus is on financial systems (loan
          origination, credit bureaus, risk management) and B2B SaaS platforms. I write

        <h2>Production Case Studies</h2>
        <ul>
          <li><strong>STARSOL</strong> — B2B SaaS for risk management (SARLAFT, SARC, SIAR). Async architecture with 3 background workers, .NET MAUI client, AWS infrastructure.</li>
          <li><strong>Loan Origination System (LOS)</strong> — 114+ API endpoints in 6 BFF layers, 27 stored procedures, 23-state lifecycle, biometric verification, INSERT-ONLY audit trail. Clean Architecture with .NET 8, Dapper, SQL Server.</li>
          <li><strong>SOVI (Identity Validation Orchestrator)</strong> — Strategy pattern with voice bot + manual fallback. Catalog-driven decision engine with no hardcoded if/switch.</li>
          <li><strong>Datacredito API</strong> — Credit bureau integration with Polly circuit breaker + retry. Query times reduced from 3s to 400ms. JWT auth, Serilog structured logging.</li>
          <li><strong>Kampot Payroll</strong> — Extended CRM routing for 48 payroll types. 21 Crystal Reports templates, zero breaks in legacy payroll.</li>
          <li><strong>Admin Module UI</strong> — Separated monitoring dashboard from CRUD configuration. Navigation reflects clean backend architecture.</li>
        </ul>
        <h2>Technical Blog</h2>
        <ul>
          <li><strong>Clean Architecture in a Loan Origination System</strong> — How I designed 114 endpoints in 6 BFF layers with zero logic duplication.</li>

          <li><strong>Centralized Communications API</strong> — From 5 systems with separate API keys to 1 multi-tenant API. Provider-agnostic, full audit trail.</li>
          <li><strong>Dual-Frontend Clean Architecture</strong> — Blazor + REST API sharing the same Application Services via shared DI container.</li>
