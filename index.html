    <!-- Theme boot.
         Runs before first paint so a returning XP visitor never sees the
         newspaper flash first. Deliberately inline and dependency-free: the
         React bundle resolves far too late to prevent that flash. The storage
         key is mirrored from THEME_STORAGE_KEY in src/theme/ThemeContext.tsx.
         Only an explicit 'xp' is honoured; every other value (including a
         stale 'book') leaves the default newspaper untouched. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('portfolio-theme') === 'xp') {
            document.documentElement.dataset.theme = 'xp'
          }
        } catch (e) {
          /* Blocked storage — the newspaper theme is the safe default. */
        }
      })()
    </script>
