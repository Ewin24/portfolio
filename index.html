<h1>Edwin Trigos — Software Architect &amp; Full Stack Developer</h1>
<p>Software Architect and Full Stack Developer with 5+ years building production systems in .NET, Clean Architecture, fintech, and cloud infrastructure. Based in Bucaramanga, Colombia. Remote-ready.</p>
<h2>About</h2>
<p>I design and build production-grade systems end-to-end: from clean architecture foundations to cloud deployment. My current focus is on financial systems (loan origination, credit bureaus, risk management) and B2B SaaS platforms. I write detailed case studies documenting the real architecture decisions, metrics, and tradeoffs from systems I've shipped.</p>
<h2>Production Case Studies</h2>
<article>
<h3>Sistema de Originación de Crédito (LOS) — Fábricas de Crédito QUAC</h3>
<p><strong>Company</strong>: Fábricas de Crédito QUAC. <strong>Period</strong>: 2025 – 2026. <strong>Stack</strong>: .NET 8+, C#, Dapper, SQL Server, Clean Architecture, REST API, JWT, Strategy Pattern.</p>
<p><strong>Problem</strong>: La empresa no contaba con un sistema digital de originación de crédito. Las solicitudes se procesaban de forma manual, tomando días en completarse, sin validación de identidad ni detección de fraude. Cada solicitud requería revisión humana sin automatización, generando demoras, errores de conciliación y exposición a suplantación de identidad.</p>
<p><strong>Solution</strong>: Diseñé y construí el sistema completo desde cero. En la capa de datos: DDL con 4 esquemas lógicos (cfg/cat/fab/aud), 30+ tablas transaccionales, máquina de estados de 23 estados, y 27 stored procedures optimizados. En la capa de servicios: API REST en .NET con Clean Architecture — repositorios por esquema, servicios por dominio funcional (Estudio, Tercero, OTP, Biometría) y controladores por canal (Admin/Tienda/Web/Handoff). Implementé el SOVI (Sistema Orquestador de Validación de Identidad) con patrón Strategy para verificación por bot de voz + validación manual, con motor de decisiones catalog-driven (sin if/switch hardcodeados). Integré detección de fraude con análisis biométrico de fotografías y un flujo completo de auditoría INSERT-ONLY.</p>
<p><strong>Impact</strong>: 114+ endpoints API en 6 capas BFF (Admin/Core/Tienda/Web/Handoff/Util). 27 stored procedures en producción. 23 estados de ciclo de vida de crédito con trazabilidad completa. Verificación de identidad automatizada vía bot de voz con plan B manual como ciudadano de primera clase. Auditoría inmutable de todas las operaciones.</p>
</article>
<article>
<h3>SOVI — Sistema Orquestador de Validación de Identidad</h3>
<p><strong>Company</strong>: Fábricas de Crédito QUAC. <strong>Period</strong>: 2026. <strong>Stack</strong>: .NET, C#, SQL Server, Strategy Pattern, REST API.</p>
<p><strong>Problem</strong>: El sistema de originación de crédito (LOS) requería validar la identidad del cliente en tiempo real mientras estaba activo en el flujo de solicitud. Sin esta validación, el riesgo de suplantación de identidad era crítico. Necesitaba un sistema que funcionara tanto automatizado (bot de voz) como con respaldo manual, con trazabilidad completa de cada intento.</p>
<p><strong>Solution</strong>: Diseñé el SOVI con tres tablas especializadas (catálogo de diagnósticos, campañas por estudio, intentos con biometría). Implementé el patrón Strategy con dos estrategias: BotValidacionStrategy (automático vía bot de voz) y ManualValidacionStrategy (asesor humano como plan B). El motor de decisiones no tiene if/switch hardcodeados — cada diagnóstico del bot dispara una AccionSistema desde el catálogo en base de datos. Cada intento registra timestamps, URL de audio y datos biométricos para auditoría completa.</p>
<p><strong>Impact</strong>: Validación de identidad en tiempo real sin intervención humana en el flujo estándar. Plan B manual como ciudadano de primera clase (no un fallback after-thought). Motor de decisiones catalog-driven: agregar nuevos diagnósticos no requiere cambios de código. Trazabilidad completa por estudio con 10+ diagnósticos de bot categorizados.</p>
</article>
<article>
<h3>API de Integración con Burós de Crédito — Datacredito</h3>
<p><strong>Company</strong>: Baguer Software. <strong>Period</strong>: 2024 – 2025. <strong>Stack</strong>: .NET 8, C#, Dapper, SQL Server, Polly, Serilog, JWT, REST API.</p>
<p><strong>Problem</strong>: El proceso de consulta a centrales de riesgo (Datacredito) requería integración manual con formatos legacy. Las consultas fallaban frecuentemente por errores de formato, y no había resiliencia ante fallos de red del proveedor externo. No existía trazabilidad de las consultas realizadas.</p>
<p><strong>Solution</strong>: Construí una API REST en .NET 8 con Dapper + SQL Server, implementando patrones de resiliencia con Polly (circuit breaker + retry policy), autenticación JWT, y logging estructurado con Serilog. Implementé un middleware de request/response logging con sanitización de campos sensibles. Arquitectura en 3 capas (Web/Data/Common) con inyección de dependencias.</p>
<p><strong>Impact</strong>: Consultas automatizadas al 100%. Resiliencia ante fallos del proveedor externo con circuit breaker y retry policy. Trazabilidad completa via Serilog. Arquitectura preparada para migración a .NET 10 sin cambios estructurales.</p>
</article>
<article>
<h3>Sistema de Nómina Kampot — Generación de Documentos ERP</h3>
<p><strong>Company</strong>: Baguer Software. <strong>Period</strong>: 2025 – 2026. <strong>Stack</strong>: C#, .NET Framework, Crystal Reports, SQL Server, ERP.</p>
<p><strong>Problem</strong>: El ERP manejaba 45+ tipos de nómina (contratos, terminaciones, cartas) con rutas de documentos estáticas. Tres nuevos tipos de nómina Kampot (Comercial, Administrativa, Temporada) requerían sus propias plantillas Crystal Reports, y el sistema existente usaba rutas compartidas que no permitían personalización por tipo.</p>
<p><strong>Solution</strong>: Extendí el sistema de enrutamiento de documentos del CRM para soportar los 3 nuevos tipos de nómina Kampot. Modifiqué el CrmController.cs para actualizar la lógica de enrutamiento dinámico: añadí los IDs 46/47/48 al array de nóminas por cuotas, agregué casos específicos en ObtenerNombreContrato(), y creé 21 archivos .rpt (7 por nómina) en una nueva carpeta CReports/Kampot/. Todo siguiendo el patrón existente sin afectar las 45+ nóminas legacy.</p>
<p><strong>Impact</strong>: Extensión no-invasiva: 0 breaks en nóminas legacy. 21 plantillas Crystal Reports organizadas por tipo de nómina. Patrón reusable para futuros tipos de contrato. Sistema de enrutamiento dinámico probado con 48 tipos de nómina.</p>
</article>
<article>
<h3>Arquitectura UI para Módulo Administrativo de LOS</h3>
<p><strong>Company</strong>: Baguer Software. <strong>Period</strong>: 2026. <strong>Stack</strong>: React, TypeScript, REST API, UI Architecture.</p>
<p><strong>Problem</strong>: La API V2 del sistema de originación de crédito tenía dominios backend bien estructurados (AUD, CAT, CFG, FAB), pero la interfaz de administración no reflejaba esta separación. El monitoreo en tiempo real (auditoría, colas de crédito) estaba mezclado con la configuración CRUD (catálogos, reglas de negocio), creando una experiencia confusa para el operador.</p>
<p><strong>Solution</strong>: Diseñé la reestructuración del módulo Admin en dos macro-módulos: &quot;Panel de Control&quot; (dashboard de monitoreo consumiendo endpoints AUD + FAB read-only) y &quot;Módulo Administrar&quot; (interfaz tipo navegador con tabs: Catálogos/CAT, Workflow/CFG, Operación/FAB). Mapeé cada área del backend a su macro-módulo correspondiente, delegando la gestión de roles/permisos a la aplicación host. La navegación refleja la arquitectura limpia del backend.</p>
<p><strong>Impact</strong>: Separación clara de responsabilidades UI (monitoreo vs. configuración). Arquitectura escalable: agregar nuevas capacidades solo requiere crear un nuevo tab en el macro-módulo correspondiente. Sin duplicación de lógica de permisos. Consistencia con la arquitectura limpia del backend.</p>
</article>
<article>
<h3>Portfolio con Arquitectura Híbrida (React 19 + Vite)</h3>
<p><strong>Company</strong>: Proyecto Personal. <strong>Period</strong>: 2024 – Presente. <strong>Stack</strong>: React 19, TypeScript, Vite, Tailwind CSS v4, Framer Motion, GitHub API.</p>
<p><strong>Problem</strong>: Los portfolios de desarrolladores muestran código pero no el impacto de negocio. Depender exclusivamente de la API de GitHub para mostrar proyectos oculta el trabajo más valioso: sistemas privados empresariales bajo NDA. Necesitaba una plataforma que vendiera ingeniería, no solo repositorios públicos.</p>
<p><strong>Solution</strong>: Diseñé una arquitectura híbrida: capa de contenido curado (casos de estudio en TypeScript con formato STAR, experiencia laboral, blog) como fuente principal de verdad, y API de GitHub como widget secundario de actividad. Implementé i18n nativo (ES/EN), design system editorial pixel-art con sombras pixeladas y tipografía de periódico, y animaciones con Framer Motion. Construido con React 19 + Vite + TypeScript + Tailwind CSS v4.</p>
<p><strong>Impact</strong>: Arquitectura que prioriza el impacto de negocio sobre el código fuente. Casos de estudio con NDA sin exponer información confidencial. i18n nativo sin librerías externas. Design system propio que diferencia visualmente de portfolios genéricos. Agregar un caso de estudio = 1 objeto TypeScript.</p>
</article>
<article>
<h3>STARSOL — Plataforma SaaS para Gestión Integral de Riesgos</h3>
<p><strong>Company</strong>: STARSOL. <strong>Period</strong>: 2024 – Presente. <strong>Stack</strong>: PHP, Laravel, AWS, .NET MAUI, MySQL, Docker, CI/CD.</p>
<p><strong>Problem</strong>: Las entidades del sector solidario (cooperativas, fondos de empleados) enfrentaban procesos manuales para la gestión de riesgos SARLAFT, SARC y SIAR, con flujos de originación de crédito y monitoreo normativo sin digitalizar. El servidor web monolítico se convertía en cuello de botella al procesar archivos financieros pesados de forma sincrónica, degradando la experiencia del usuario.</p>
<p><strong>Solution</strong>: Diseñé y construí STARSOL desde cero como plataforma SaaS B2B en PHP con Laravel, implementando una arquitectura asíncrona con 3 background workers que procesan jobs simultáneamente, desacoplando completamente la carga de archivos del hilo principal del servidor web. Para la gestión avanzada de archivos, desarrollé una aplicación cliente en .NET MAUI con capacidad offline que se sincroniza con el backend en la nube. A nivel de infraestructura, aprovisioné entornos de alta disponibilidad en AWS con prácticas CI/CD, garantizando escalabilidad para el procesamiento de datos financieros sensibles.</p>
<p><strong>Impact</strong>: Arquitectura asíncrona que eliminó cuellos de botella del servidor web mediante 3 workers simultáneos. Aplicación cliente .NET MAUI con sincronización offline para gestión de archivos financieros. Infraestructura cloud en AWS con alta disponibilidad y CI/CD. Plataforma SaaS B2B completa para el sector solidario cubriendo SARLAFT, SARC y SIAR.</p>
</article>

<p>Cuando te dan un proyecto desde cero, la tentación es abrir Visual Studio y empezar a escribir controladores. Pero sin una estructura clara, en 3 meses tienes un Big Ball of Mud. Así diseñé la arquitectura del LOS antes de escribir una línea de código de producción.</p>

<article>
<h3>Eliminé todos los if/switch de mi motor de decisiones (y por qué deberías hacer lo mismo)</h3>
<p><strong>Published</strong>: 2026-03-20. <strong>Category</strong>: arquitectura. <strong>Tags</strong>: arquitectura, patrones, C#, design patterns.</p>
<p>Cuando construyes un sistema que toma decisiones basadas en diagnósticos externos (un bot de voz, un servicio de validación), la tentación es escribir switch(mensaje) { case &quot;ERROR&quot;: ... }. Eso es deuda técnica inmediata. Te cuento cómo lo evité con un motor catalog-driven.</p>
</article>
<article>

<p><strong>Published</strong>: 2026-06-15. <strong>Category</strong>: arquitectura. <strong>Tags</strong>: arquitectura, .NET, clean architecture, API, patrones.</p>
<p>Cada área de la empresa gestionaba el correo por su cuenta, con su propia implementación, su propia clave API, y su propia definición de &quot;éxito&quot;. Hasta que el proveedor decía &quot;no me llegó el comprobante&quot; y nadie sabía qué pasó. Así diseñé una API centralizada que eliminó el black box de las comunicaciones empresariales.</p>
</article>
<article>
<h3>Diseñé un ERP donde la capa de presentación (Blazor) y la REST API son intercambiables gracias a Clean Architecture</h3>
<p><strong>Published</strong>: 2026-07-01. <strong>Category</strong>: arquitectura. <strong>Tags</strong>: .NET, clean architecture, Blazor, ASP.NET Core, C#.</p>
<p>Cómo logré que Blazor y la API compartieran exactamente la misma lógica de negocio en un ERP de producción mediante inyección de dependencias en Clean Architecture, eliminando duplicación y acelerando el desarrollo de características.</p>
</article>
<article>
<h3>Todo el error handling de mi API se reduce a dos archivos: así eliminé los try-catch de mis controladores</h3>
<p><strong>Published</strong>: 2026-07-15. <strong>Category</strong>: arquitectura. <strong>Tags</strong>: arquitectura, .NET, ASP.NET Core, patrones, C#.</p>
<p>Cada controller tenía su propio try-catch, cada error devolvía un formato distinto, y los mensajes mezclaban detalles técnicos con reglas de negocio. Unificarlo todo en dos archivos — DomainExceptions.cs + ExceptionHandlingMiddleware — cambió la forma en que pensamos los errores.</p>
</article>
