<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Escalera conceptual: qué tan comprobable es un encargo</title>
  <desc>Esquema conceptual, no datos medidos. Cuatro peldaños, del menos al más comprobable. Uno: descripción, se cumple si se parece. Dos: criterio escrito, una persona marca sí o no. Tres: ejemplo con resultado, entrada y salida esperada por escrito. Cuatro, resaltado: comprobación que falla hoy, la juzga un comando.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="350" fill="#FAFAF5" />

  <!-- Axis without tick values: this is a sketch, not measured data. -->
  <line x1="70" y1="326" x2="70" y2="40" stroke="#D0CFC8" stroke-width="2" />
  <polygon points="70,26 64,40 76,40" fill="#D0CFC8" />
  <text transform="translate(40 176) rotate(-90)" text-anchor="middle" font-size="14" fill="#6B6B6B">más comprobable →</text>

  <!-- Rung 4, highlighted. Identified by its number and text, not only by color. -->
  <rect x="100" y="24" width="480" height="68" fill="#F0EFE8" stroke="#C41E1E" stroke-width="2" />
  <text x="116" y="52" font-size="16" font-weight="700" fill="#C41E1E">4. COMPROBACIÓN QUE FALLA HOY</text>
  <text x="116" y="76" font-size="14" fill="#4A4A4A">La juzga un comando.</text>

  <rect x="100" y="102" width="480" height="68" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="116" y="130" font-size="16" font-weight="700" fill="#1A1A1A">3. EJEMPLO CON RESULTADO</text>
  <text x="116" y="154" font-size="14" fill="#4A4A4A">Entrada y salida esperada, por escrito.</text>

  <rect x="100" y="180" width="480" height="68" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="116" y="208" font-size="16" font-weight="700" fill="#1A1A1A">2. CRITERIO ESCRITO</text>
  <text x="116" y="232" font-size="14" fill="#4A4A4A">Una persona marca sí o no.</text>

  <rect x="100" y="258" width="480" height="68" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="116" y="286" font-size="16" font-weight="700" fill="#1A1A1A">1. DESCRIPCIÓN</text>
  <text x="116" y="310" font-size="14" fill="#4A4A4A">Se cumple si se parece.</text>
</svg>
