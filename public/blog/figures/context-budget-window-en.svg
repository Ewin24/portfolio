<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>The context window as a budget bar, before and after</title>
  <desc>Conceptual sketch with no scale. Two bars of the same width stand for the same context window. In the top one, files read and tool output take almost everything and very little free space is left. In the bottom one the instructions are the same size, files read, tool output and conversation are much shorter, and free space takes half the bar.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="310" fill="#FAFAF5" />

  <!-- Before: everything enters whole. -->
  <text x="40" y="40" font-size="14" font-weight="700" fill="#1A1A1A">before: everything goes in whole</text>
  <rect x="40" y="50" width="70" height="50" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2" />
  <rect x="110" y="50" width="200" height="50" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="2" />
  <rect x="310" y="50" width="150" height="50" fill="#6B6B6B" stroke="#1A1A1A" stroke-width="2" />
  <rect x="460" y="50" width="80" height="50" fill="#F0EFE8" stroke="#1A1A1A" stroke-width="2" />
  <rect x="540" y="50" width="20" height="50" fill="#FAFAF5" stroke="#C41E1E" stroke-width="2" />
  <text x="75" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#FAFAF5">A</text>
  <text x="210" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#FAFAF5">B</text>
  <text x="385" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#FAFAF5">C</text>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">D</text>
  <text x="550" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#C41E1E">E</text>

  <!-- After: same instructions, bounded reads, conclusions instead of transcripts. -->
  <text x="40" y="140" font-size="14" font-weight="700" fill="#1A1A1A">after: what the task uses goes in</text>
  <rect x="40" y="150" width="70" height="50" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2" />
  <rect x="110" y="150" width="60" height="50" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="2" />
  <rect x="170" y="150" width="40" height="50" fill="#6B6B6B" stroke="#1A1A1A" stroke-width="2" />
  <rect x="210" y="150" width="70" height="50" fill="#F0EFE8" stroke="#1A1A1A" stroke-width="2" />
  <rect x="280" y="150" width="280" height="50" fill="#FAFAF5" stroke="#C41E1E" stroke-width="2" />
  <text x="75" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#FAFAF5">A</text>
  <text x="140" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#FAFAF5">B</text>
  <text x="190" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#FAFAF5">C</text>
  <text x="245" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">D</text>
  <text x="420" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#C41E1E">E</text>

  <!-- Legend: letters carry the meaning, not the fills. -->
  <rect x="40" y="226" width="14" height="14" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2" />
  <text x="64" y="238" font-size="14" fill="#1A1A1A">A instructions</text>
  <rect x="40" y="252" width="14" height="14" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="2" />
  <text x="64" y="264" font-size="14" fill="#1A1A1A">B files read</text>
  <rect x="40" y="278" width="14" height="14" fill="#6B6B6B" stroke="#1A1A1A" stroke-width="2" />
  <text x="64" y="290" font-size="14" fill="#1A1A1A">C tool output</text>
  <rect x="330" y="226" width="14" height="14" fill="#F0EFE8" stroke="#1A1A1A" stroke-width="2" />
  <text x="354" y="238" font-size="14" fill="#1A1A1A">D conversation</text>
  <rect x="330" y="252" width="14" height="14" fill="#FAFAF5" stroke="#C41E1E" stroke-width="2" />
  <text x="354" y="264" font-size="14" fill="#1A1A1A">E free space</text>
</svg>
