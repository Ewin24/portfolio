<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Las comprobaciones del caso AsyncLocal, de la más barata a la más cara</title>
  <desc>Cuatro escalones de ancho creciente, sin escala. Comprobaciones baratas: leer dos logs lado a lado y reproducir en cinco líneas. Lo que la lectura obvia pedía: revisar conectividad, timeouts y credenciales, y abrir conversación con un tercero. Esquema conceptual, no datos medidos.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="330" fill="#FAFAF5" />

  <!-- Step width grows with relative cost; no scale. Groups are named by their heading, not only by color. -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1A1A1A">COMPROBACIONES BARATAS</text>
  <rect x="20" y="40" width="60" height="40" fill="#1A1A1A" />
  <text x="94" y="66" font-size="14" fill="#1A1A1A">Leer dos logs lado a lado</text>
  <rect x="20" y="88" width="120" height="40" fill="#1A1A1A" />
  <text x="154" y="114" font-size="14" fill="#1A1A1A">Reproducir en cinco líneas</text>

  <text x="20" y="164" font-size="14" font-weight="700" fill="#C41E1E">LO QUE LA LECTURA OBVIA PEDÍA</text>
  <rect x="20" y="176" width="180" height="40" fill="#C41E1E" />
  <text x="214" y="202" font-size="14" fill="#1A1A1A">Conectividad, timeouts, credenciales</text>
  <rect x="20" y="224" width="240" height="40" fill="#C41E1E" />
  <text x="274" y="250" font-size="14" fill="#1A1A1A">Abrir conversación con un tercero</text>

  <line x1="20" y1="284" x2="260" y2="284" stroke="#1A1A1A" stroke-width="2" />
  <text x="20" y="310" font-size="14" fill="#6B6B6B">costo de comprobar →</text>
</svg>
