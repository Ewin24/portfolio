<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 374" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Vida de una nota de memoria: escrita, recordada, vencida, reemplazada</title>
  <desc>Esquema conceptual, no datos medidos. Cuatro estados en columna, unidos por flechas hacia abajo. Escrita: lleva fecha, razón y un solo tema. Recordada: vuelve en una búsqueda y se usa, es una pista que falta comprobar. Vencida, resaltada: el código cambió y la nota no, nada la marca y sigue activa. Reemplazada: una nota nueva dice cuál gana y la vieja apunta a la nueva.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="374" fill="#FAFAF5" />

  <!-- Arrows between states -->
  <line x1="105" y1="80" x2="105" y2="104" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="105,114 99,102 111,102" fill="#1A1A1A" />
  <line x1="105" y1="170" x2="105" y2="194" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="105,204 99,192 111,192" fill="#1A1A1A" />
  <line x1="105" y1="260" x2="105" y2="284" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="105,294 99,282 111,282" fill="#1A1A1A" />

  <!-- 1. Written -->
  <rect x="30" y="24" width="150" height="56" fill="#FAFAF5" stroke="#1A1A1A" stroke-width="2" />
  <text x="105" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">ESCRITA</text>
  <text x="200" y="46" font-size="14" fill="#4A4A4A">Lleva fecha, razón y un solo tema.</text>
  <text x="200" y="68" font-size="14" fill="#4A4A4A">Aquí se decide si merece existir.</text>

  <!-- 2. Recalled -->
  <rect x="30" y="114" width="150" height="56" fill="#FAFAF5" stroke="#1A1A1A" stroke-width="2" />
  <text x="105" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">RECORDADA</text>
  <text x="200" y="136" font-size="14" fill="#4A4A4A">Vuelve en una búsqueda y se usa.</text>
  <text x="200" y="158" font-size="14" fill="#4A4A4A">Es una pista, falta comprobarla.</text>

  <!-- 3. Stale: highlighted by fill, border and its own wording, not only by color. -->
  <rect x="30" y="204" width="150" height="56" fill="#F0EFE8" stroke="#C41E1E" stroke-width="2" />
  <text x="105" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#C41E1E">VENCIDA</text>
  <text x="200" y="226" font-size="14" fill="#4A4A4A">El código cambió y la nota no.</text>
  <text x="200" y="248" font-size="14" font-weight="700" fill="#C41E1E">Nada la marca: sigue activa.</text>

  <!-- 4. Replaced -->
  <rect x="30" y="294" width="150" height="56" fill="#FAFAF5" stroke="#1A1A1A" stroke-width="2" />
  <text x="105" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">REEMPLAZADA</text>
  <text x="200" y="316" font-size="14" fill="#4A4A4A">Una nota nueva dice cuál gana.</text>
  <text x="200" y="338" font-size="14" fill="#4A4A4A">La vieja apunta a la nueva.</text>
</svg>
