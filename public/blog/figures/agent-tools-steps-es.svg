<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Los cuatro momentos de una llamada a una herramienta y cómo falla cada uno</title>
  <desc>Tabla conceptual de cuatro filas. Paso 1, elegir: el modelo lee el nombre y la descripción; falla llamando a otra herramienta o a ninguna. Paso 2, llenar: lee los nombres de los parámetros y su esquema; falla inventando o confundiendo un valor. Paso 3, leer: lee el resultado devuelto; falla perdiéndose entre filas e identificadores. Paso 4, corregir: lee el mensaje de error; falla repitiendo la misma llamada. Esquema conceptual, no datos medidos.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="360" fill="#FAFAF5" />
  <rect x="20" y="20" width="560" height="40" fill="#F0EFE8" />

  <!-- Row separators, recessive -->
  <line x1="20" y1="130" x2="580" y2="130" stroke="#D0CFC8" stroke-width="2" />
  <line x1="20" y1="200" x2="580" y2="200" stroke="#D0CFC8" stroke-width="2" />
  <line x1="20" y1="270" x2="580" y2="270" stroke="#D0CFC8" stroke-width="2" />
  <line x1="170" y1="20" x2="170" y2="340" stroke="#D0CFC8" stroke-width="2" />
  <line x1="375" y1="20" x2="375" y2="340" stroke="#D0CFC8" stroke-width="2" />

  <rect x="20" y="20" width="560" height="320" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <line x1="20" y1="60" x2="580" y2="60" stroke="#1A1A1A" stroke-width="2" />

  <!-- Header -->
  <text x="32" y="45" font-size="14" font-weight="700" fill="#1A1A1A">PASO</text>
  <text x="182" y="45" font-size="14" font-weight="700" fill="#1A1A1A">LO QUE LEE EL MODELO</text>
  <text x="387" y="45" font-size="14" font-weight="700" fill="#C41E1E">CÓMO FALLA</text>

  <!-- 1 -->
  <text x="32" y="100" font-size="14" font-weight="700" fill="#1A1A1A">1. ELEGIR</text>
  <text x="182" y="100" font-size="14" fill="#4A4A4A">nombre y descripción</text>
  <text x="387" y="90" font-size="14" fill="#4A4A4A">llama a otra,</text>
  <text x="387" y="110" font-size="14" fill="#4A4A4A">o a ninguna</text>

  <!-- 2 -->
  <text x="32" y="170" font-size="14" font-weight="700" fill="#1A1A1A">2. LLENAR</text>
  <text x="182" y="160" font-size="14" fill="#4A4A4A">nombres de parámetros</text>
  <text x="182" y="180" font-size="14" fill="#4A4A4A">y su esquema</text>
  <text x="387" y="160" font-size="14" fill="#4A4A4A">inventa o confunde</text>
  <text x="387" y="180" font-size="14" fill="#4A4A4A">un valor</text>

  <!-- 3 -->
  <text x="32" y="240" font-size="14" font-weight="700" fill="#1A1A1A">3. LEER</text>
  <text x="182" y="240" font-size="14" fill="#4A4A4A">el resultado devuelto</text>
  <text x="387" y="230" font-size="14" fill="#4A4A4A">se pierde entre</text>
  <text x="387" y="250" font-size="14" fill="#4A4A4A">filas e ids</text>

  <!-- 4 -->
  <text x="32" y="310" font-size="14" font-weight="700" fill="#1A1A1A">4. CORREGIR</text>
  <text x="182" y="310" font-size="14" fill="#4A4A4A">el mensaje de error</text>
  <text x="387" y="300" font-size="14" fill="#4A4A4A">repite la misma</text>
  <text x="387" y="320" font-size="14" fill="#4A4A4A">llamada</text>
</svg>
