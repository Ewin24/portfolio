<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Costo acumulado en el tiempo: arreglo que funciona contra corrección de raíz</title>
  <desc>Esquema conceptual sin escala. La corrección de raíz sube una sola vez al inicio y queda plana. El arreglo que funciona empieza casi en cero y sube un escalón con cada copia, hasta superar a la corrección.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="360" fill="#FAFAF5" />

  <!-- Axes without tick values: this is a sketch, not measured data. -->
  <polyline points="60,44 60,300 572,300" fill="none" stroke="#D0CFC8" stroke-width="2" />
  <polygon points="60,34 54,46 66,46" fill="#D0CFC8" />
  <polygon points="582,300 570,294 570,306" fill="#D0CFC8" />
  <text x="76" y="46" font-size="14" fill="#6B6B6B">costo acumulado</text>
  <text x="570" y="326" text-anchor="end" font-size="14" fill="#6B6B6B">tiempo</text>

  <!-- Root fix: expensive once, flat after. -->
  <polyline points="60,300 90,300 90,140 570,140" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="102" y="128" font-size="14" font-weight="700" fill="#1A1A1A">corrección de raíz</text>

  <!-- Workaround: cheap now, one step up per copy. -->
  <polyline points="60,300 90,300 90,284 170,284 170,258 250,258 250,224 330,224 330,184 410,184 410,132 490,132 490,84 570,84" fill="none" stroke="#C41E1E" stroke-width="2" />
  <text x="570" y="70" text-anchor="end" font-size="14" font-weight="700" fill="#C41E1E">arreglo que funciona</text>

  <!-- Each riser is one more copy of the workaround. -->
  <text x="178" y="278" font-size="14" fill="#4A4A4A">+1 copia</text>
  <text x="258" y="244" font-size="14" fill="#4A4A4A">+1</text>
  <text x="338" y="204" font-size="14" fill="#4A4A4A">+1</text>
  <text x="418" y="164" font-size="14" fill="#4A4A4A">+1</text>
  <text x="498" y="112" font-size="14" fill="#4A4A4A">+1</text>

  <!-- Crossing point: its position is unknown when the choice is made. -->
  <rect x="405" y="135" width="10" height="10" fill="#FAFAF5" stroke="#1A1A1A" stroke-width="2" />
</svg>
