<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Conceptual sketch: code written against code verified</title>
  <desc>Two lines over time. They grow together up to a marker labeled AI. After it, the code written line climbs steeply while the code verified line keeps its slope; the area between them is labeled unverified. No numeric values: this is not measured data.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="360" fill="#FAFAF5" />

  <!-- Gap between the two lines after the marker. -->
  <polygon points="260,230 540,60 540,200 260,245" fill="#F0EFE8" />

  <!-- Axes, no tick values on purpose. -->
  <line x1="60" y1="40" x2="60" y2="300" stroke="#D0CFC8" stroke-width="2" />
  <line x1="60" y1="300" x2="570" y2="300" stroke="#D0CFC8" stroke-width="2" />
  <text x="60" y="28" font-size="14" fill="#6B6B6B">volume</text>
  <text x="570" y="326" text-anchor="end" font-size="14" fill="#6B6B6B">time →</text>

  <!-- Marker: writing code becomes cheap. -->
  <line x1="260" y1="40" x2="260" y2="300" stroke="#6B6B6B" stroke-width="2" stroke-dasharray="2 6" />
  <text x="268" y="56" font-size="16" font-weight="700" fill="#4A4A4A">AI</text>

  <polyline points="60,270 260,230 540,60" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <polyline points="60,280 260,245 540,200" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="8 5" />

  <text x="404" y="118" text-anchor="end" font-size="15" font-weight="700" fill="#1A1A1A">code written</text>
  <text x="540" y="250" text-anchor="end" font-size="15" fill="#4A4A4A">code verified</text>

  <!-- Bracket and label for the gap. -->
  <path d="M546 60 H554 V200 H546" fill="none" stroke="#C41E1E" stroke-width="2" />
  <text x="472" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#C41E1E">unverified</text>
</svg>
