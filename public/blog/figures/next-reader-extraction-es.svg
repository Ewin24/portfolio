<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Qué llega entero de una página a la respuesta de un modelo</title>
  <desc>Esquema conceptual sin escala. Cuatro tipos de frase recorren el camino de la página a la respuesta pasando por la extracción. La frase que nombra su sujeto y el número con su método llegan enteros. El pronombre sin antecedente y la referencia a la página llegan sin su referente.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="372" fill="#FAFAF5" />

  <!-- Stages of the path. No scale: this is a sketch, not measured data. -->
  <text x="16" y="28" font-size="14" fill="#6B6B6B">PÁGINA</text>
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#6B6B6B">EXTRACCIÓN</text>
  <text x="584" y="28" text-anchor="end" font-size="14" fill="#6B6B6B">RESPUESTA DEL MODELO</text>
  <line x1="16" y1="40" x2="584" y2="40" stroke="#D0CFC8" stroke-width="2" />

  <!-- 1. Self-contained sentence: arrives whole. -->
  <text x="16" y="72" font-size="14" font-weight="700" fill="#1A1A1A">1  Frase que nombra su sujeto</text>
  <text x="584" y="72" text-anchor="end" font-size="14" font-weight="700" fill="#1A1A1A">LLEGA ENTERA</text>
  <text x="16" y="92" font-size="14" fill="#4A4A4A">«El grep sin mayúsculas no ve camelCase»</text>
  <line x1="16" y1="110" x2="572" y2="110" stroke="#1A1A1A" stroke-width="2" />
  <line x1="300" y1="102" x2="300" y2="118" stroke="#4A4A4A" stroke-width="2" />
  <rect x="572" y="104" width="12" height="12" fill="#1A1A1A" />

  <!-- 2. Number with its method: arrives whole. -->
  <text x="16" y="148" font-size="14" font-weight="700" fill="#1A1A1A">2  Número con su método</text>
  <text x="584" y="148" text-anchor="end" font-size="14" font-weight="700" fill="#1A1A1A">LLEGA ENTERA</text>
  <text x="16" y="168" font-size="14" fill="#4A4A4A">«anterior en 13,339 de 20,000 ejecuciones»</text>
  <line x1="16" y1="186" x2="572" y2="186" stroke="#1A1A1A" stroke-width="2" />
  <line x1="300" y1="178" x2="300" y2="194" stroke="#4A4A4A" stroke-width="2" />
  <rect x="572" y="180" width="12" height="12" fill="#1A1A1A" />

  <!-- 3. Pronoun without antecedent: the words arrive, the referent does not. -->
  <text x="16" y="224" font-size="14" font-weight="700" fill="#1A1A1A">3  Pronombre sin antecedente</text>
  <text x="584" y="224" text-anchor="end" font-size="14" font-weight="700" fill="#C41E1E">PIERDE EL REFERENTE</text>
  <text x="16" y="244" font-size="14" fill="#4A4A4A">«Esto es lo que cambié en el proceso»</text>
  <line x1="16" y1="262" x2="300" y2="262" stroke="#C41E1E" stroke-width="2" />
  <line x1="300" y1="262" x2="572" y2="262" stroke="#C41E1E" stroke-width="2" stroke-dasharray="4 8" />
  <line x1="300" y1="254" x2="300" y2="270" stroke="#4A4A4A" stroke-width="2" />
  <rect x="573" y="257" width="10" height="10" fill="#FAFAF5" stroke="#C41E1E" stroke-width="2" />

  <!-- 4. Reference to a position on the page: same fate. -->
  <text x="16" y="300" font-size="14" font-weight="700" fill="#1A1A1A">4  Referencia a la página</text>
  <text x="584" y="300" text-anchor="end" font-size="14" font-weight="700" fill="#C41E1E">PIERDE EL REFERENTE</text>
  <text x="16" y="320" font-size="14" fill="#4A4A4A">«Como muestra la tabla de arriba»</text>
  <line x1="16" y1="338" x2="300" y2="338" stroke="#C41E1E" stroke-width="2" />
  <line x1="300" y1="338" x2="572" y2="338" stroke="#C41E1E" stroke-width="2" stroke-dasharray="4 8" />
  <line x1="300" y1="330" x2="300" y2="346" stroke="#4A4A4A" stroke-width="2" />
  <rect x="573" y="333" width="10" height="10" fill="#FAFAF5" stroke="#C41E1E" stroke-width="2" />
</svg>
