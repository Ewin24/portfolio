<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Múltiplos del precio base de entrada según el uso de la caché de prompts</title>
  <desc>Gráfico de barras horizontales con cuatro valores leídos en la documentación de caché de prompts de Anthropic en noviembre de 2026, como múltiplos del precio base de un token de entrada: entrada normal 1, escritura en caché con vida de 5 minutos 1.25, escritura en caché con vida de 1 hora 2, lectura de caché 0.1.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="330" fill="#FAFAF5" />

  <!-- Scale: 220 px per 1x of the base input price. Every bar carries its value. -->
  <text x="40" y="44" font-size="14" fill="#1A1A1A">entrada normal (precio base)</text>
  <rect x="40" y="52" width="220" height="22" fill="#4A4A4A" />
  <text x="270" y="69" font-size="14" font-weight="700" fill="#1A1A1A">1×</text>

  <text x="40" y="112" font-size="14" fill="#1A1A1A">escritura en caché, 5 minutos</text>
  <rect x="40" y="120" width="275" height="22" fill="#1A1A1A" />
  <text x="325" y="137" font-size="14" font-weight="700" fill="#1A1A1A">1.25×</text>

  <text x="40" y="180" font-size="14" fill="#1A1A1A">escritura en caché, 1 hora</text>
  <rect x="40" y="188" width="440" height="22" fill="#1A1A1A" />
  <text x="490" y="205" font-size="14" font-weight="700" fill="#1A1A1A">2×</text>

  <text x="40" y="248" font-size="14" font-weight="700" fill="#C41E1E">lectura de caché</text>
  <rect x="40" y="256" width="22" height="22" fill="#C41E1E" />
  <text x="72" y="273" font-size="14" font-weight="700" fill="#C41E1E">0.1×</text>

  <text x="40" y="312" font-size="14" fill="#6B6B6B">múltiplos del precio base de entrada</text>
</svg>
