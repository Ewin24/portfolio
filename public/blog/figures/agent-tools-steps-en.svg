<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>The four moments of a tool call and how each one fails</title>
  <desc>Conceptual table with four rows. Step 1, pick: the model reads the name and the description; it fails by calling another tool, or none. Step 2, fill: it reads the parameter names and their schema; it fails by inventing or mixing up a value. Step 3, read: it reads the returned result; it fails by getting lost among rows and identifiers. Step 4, recover: it reads the error message; it fails by repeating the same call. Conceptual sketch, not measured data.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="360" fill="#FAFAF5" />
  <rect x="20" y="20" width="560" height="40" fill="#F0EFE8" />

  <!-- Row separators, recessive -->
  <line x1="20" y1="130" x2="580" y2="130" stroke="#D0CFC8" stroke-width="2" />
  <line x1="20" y1="200" x2="580" y2="200" stroke="#D0CFC8" stroke-width="2" />
  <line x1="20" y1="270" x2="580" y2="270" stroke="#D0CFC8" stroke-width="2" />
  <line x1="170" y1="20" x2="170" y2="340" stroke="#D0CFC8" stroke-width="2" />
  <line x1="375" y1="20" x2="375" y2="340" stroke="#D0CFC8" stroke-width="2" />

  <rect x="20" y="20" width="560" height="320" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <line x1="20" y1="60" x2="580" y2="60" stroke="#1A1A1A" stroke-width="2" />

  <!-- Header -->
  <text x="32" y="45" font-size="14" font-weight="700" fill="#1A1A1A">STEP</text>
  <text x="182" y="45" font-size="14" font-weight="700" fill="#1A1A1A">WHAT THE MODEL READS</text>
  <text x="387" y="45" font-size="14" font-weight="700" fill="#C41E1E">HOW IT FAILS</text>

  <!-- 1 -->
  <text x="32" y="100" font-size="14" font-weight="700" fill="#1A1A1A">1. PICK</text>
  <text x="182" y="100" font-size="14" fill="#4A4A4A">name and description</text>
  <text x="387" y="90" font-size="14" fill="#4A4A4A">calls another one,</text>
  <text x="387" y="110" font-size="14" fill="#4A4A4A">or none</text>

  <!-- 2 -->
  <text x="32" y="170" font-size="14" font-weight="700" fill="#1A1A1A">2. FILL</text>
  <text x="182" y="160" font-size="14" fill="#4A4A4A">parameter names</text>
  <text x="182" y="180" font-size="14" fill="#4A4A4A">and their schema</text>
  <text x="387" y="160" font-size="14" fill="#4A4A4A">invents or mixes up</text>
  <text x="387" y="180" font-size="14" fill="#4A4A4A">a value</text>

  <!-- 3 -->
  <text x="32" y="240" font-size="14" font-weight="700" fill="#1A1A1A">3. READ</text>
  <text x="182" y="240" font-size="14" fill="#4A4A4A">the returned result</text>
  <text x="387" y="230" font-size="14" fill="#4A4A4A">gets lost among</text>
  <text x="387" y="250" font-size="14" fill="#4A4A4A">rows and ids</text>

  <!-- 4 -->
  <text x="32" y="310" font-size="14" font-weight="700" fill="#1A1A1A">4. RECOVER</text>
  <text x="182" y="310" font-size="14" fill="#4A4A4A">the error message</text>
  <text x="387" y="300" font-size="14" fill="#4A4A4A">repeats the same</text>
  <text x="387" y="320" font-size="14" fill="#4A4A4A">call</text>
</svg>
