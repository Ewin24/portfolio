<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Defectos encontrados por rondas de revisión del mismo tipo, con un techo que no cruzan</title>
  <desc>Esquema conceptual sin escala. Una escalera de once peldaños sube cada vez menos y se aplana bajo una línea punteada, el techo de ese tipo de revisión. Por encima del techo, en una franja rotulada fuera del alcance de leer el código, hay dos marcas cuadradas rotuladas otro observador.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="360" fill="#FAFAF5" />

  <!-- Band above the ceiling: what reading the code cannot reach. -->
  <rect x="61" y="56" width="511" height="90" fill="#F0EFE8" />

  <!-- Axes without tick values: this is a sketch, not measured data. -->
  <polyline points="60,40 60,310 572,310" fill="none" stroke="#D0CFC8" stroke-width="2" />
  <polygon points="60,30 54,42 66,42" fill="#D0CFC8" />
  <polygon points="582,310 570,304 570,316" fill="#D0CFC8" />
  <text x="76" y="46" font-size="14" fill="#6B6B6B">defectos encontrados</text>
  <text x="570" y="336" text-anchor="end" font-size="14" fill="#6B6B6B">rondas</text>

  <!-- Ceiling of this kind of review. -->
  <line x1="60" y1="146" x2="572" y2="146" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4" />
  <text x="76" y="134" font-size="14" fill="#4A4A4A">techo de este tipo de revisión</text>
  <text x="76" y="84" font-size="14" fill="#4A4A4A">fuera del alcance de leer el código</text>

  <!-- Eleven rounds of the same kind: each riser is smaller than the last. -->
  <polyline points="60,310 60,230 104,230 104,196 148,196 148,178 192,178 192,168 236,168 236,162 280,162 280,159 324,159 324,157 368,157 368,156 412,156 412,155 456,155 456,154 500,154 500,153 544,153" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="250" y="230" font-size="14" font-weight="700" fill="#1A1A1A">rondas de revisión</text>
  <text x="250" y="252" font-size="14" fill="#4A4A4A">cada una encuentra menos</text>

  <!-- What a different observer found: above the ceiling, labelled, not colour alone. -->
  <text x="566" y="76" text-anchor="end" font-size="14" font-weight="700" fill="#C41E1E">otro observador</text>
  <rect x="478" y="96" width="12" height="12" fill="#C41E1E" stroke="#1A1A1A" stroke-width="2" />
  <rect x="522" y="96" width="12" height="12" fill="#C41E1E" stroke="#1A1A1A" stroke-width="2" />
</svg>
