<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Conceptual matrix: what to do with each rule in the harness</title>
  <desc>Two-by-two grid. Vertical axis: whether the rule came from a real failure, yes on top and no below. Horizontal axis: whether something can check it, yes on the left and no on the right. From a failure and checkable: keep. From a failure with no check: make it a check, because it gets read and then ignored. No failure but checkable: on probation. No failure and no check: delete. Conceptual sketch, not measured data.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="450" fill="#FAFAF5" />

  <!-- Highlighted cell: came from a failure, nothing checks it. Identified by its tag text, not only by color. -->
  <rect x="335" y="30" width="245" height="170" fill="#F0EFE8" />

  <rect x="90" y="30" width="490" height="340" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <line x1="335" y1="30" x2="335" y2="370" stroke="#1A1A1A" stroke-width="2" />
  <line x1="90" y1="200" x2="580" y2="200" stroke="#1A1A1A" stroke-width="2" />
  <rect x="339" y="34" width="237" height="162" fill="none" stroke="#C41E1E" stroke-width="2" />

  <!-- Vertical axis -->
  <text transform="translate(28 200) rotate(-90)" text-anchor="middle" font-size="14" fill="#1A1A1A">did a real failure cause it?</text>
  <text transform="translate(68 115) rotate(-90)" text-anchor="middle" font-size="14" fill="#6B6B6B">yes</text>
  <text transform="translate(68 285) rotate(-90)" text-anchor="middle" font-size="14" fill="#6B6B6B">no</text>

  <!-- Horizontal axis -->
  <text x="212" y="394" text-anchor="middle" font-size="14" fill="#6B6B6B">yes</text>
  <text x="457" y="394" text-anchor="middle" font-size="14" fill="#6B6B6B">no</text>
  <text x="335" y="428" text-anchor="middle" font-size="14" fill="#1A1A1A">can something check it?</text>

  <!-- Top left: from a failure, checkable -->
  <text x="106" y="70" font-size="16" font-weight="700" fill="#1A1A1A">1. KEEP</text>
  <text x="106" y="102" font-size="14" fill="#4A4A4A">It has a cause and</text>
  <text x="106" y="122" font-size="14" fill="#4A4A4A">something enforces it.</text>

  <!-- Top right: from a failure, not checkable -->
  <text x="355" y="70" font-size="16" font-weight="700" fill="#1A1A1A">2. MAKE IT A CHECK</text>
  <text x="355" y="102" font-size="14" fill="#4A4A4A">If nothing checks it,</text>
  <text x="355" y="122" font-size="14" fill="#4A4A4A">it is decoration.</text>
  <text x="355" y="170" font-size="14" font-weight="700" fill="#C41E1E">read, then ignored</text>

  <!-- Bottom left: no known failure, checkable -->
  <text x="106" y="240" font-size="16" font-weight="700" fill="#1A1A1A">3. ON PROBATION</text>
  <text x="106" y="272" font-size="14" fill="#4A4A4A">If it never blocks</text>
  <text x="106" y="292" font-size="14" fill="#4A4A4A">anything, drop it.</text>

  <!-- Bottom right: no known failure, not checkable -->
  <text x="355" y="240" font-size="16" font-weight="700" fill="#1A1A1A">4. DELETE</text>
  <text x="355" y="272" font-size="14" fill="#4A4A4A">Ceremony: it costs</text>
  <text x="355" y="292" font-size="14" fill="#4A4A4A">and protects nothing.</text>
</svg>
