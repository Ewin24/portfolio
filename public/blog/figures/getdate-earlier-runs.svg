<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>GETDATE() read after SYSDATETIME(): 13,339 of 20,000 runs compare as earlier</title>
  <desc>One bar split in two parts. 13,339 runs (66.7 %) where GETDATE() compared as earlier than SYSDATETIME(), and 6,661 runs (33.3 %) where it did not.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="720" height="200" fill="#FAFAF5" />

  <text x="680" y="34" text-anchor="end" font-size="12" fill="#6B6B6B">n = 20,000</text>

  <!-- Segment labels sit above their own segment, so identity never depends on color. -->
  <text x="40" y="76" font-size="13" font-weight="700" fill="#1A1A1A">GETDATE() &lt; SYSDATETIME()</text>
  <text x="468" y="76" font-size="13" fill="#4A4A4A">GETDATE() ≥ SYSDATETIME()</text>

  <!-- 640 px = 20,000 runs. 13,339 runs = 426 px, a 2 px paper gap, then 6,661 runs. -->
  <rect x="40" y="88" width="426" height="44" fill="#C41E1E" />
  <rect x="468" y="88" width="212" height="44" fill="#1A1A1A" />

  <text x="40" y="160" font-size="20" font-weight="700" fill="#1A1A1A">13,339</text>
  <text x="128" y="160" font-size="13" fill="#6B6B6B">66.7 %</text>
  <text x="468" y="160" font-size="20" font-weight="700" fill="#1A1A1A">6,661</text>
  <text x="544" y="160" font-size="13" fill="#6B6B6B">33.3 %</text>
</svg>
