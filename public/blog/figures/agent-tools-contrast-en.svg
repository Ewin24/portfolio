<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 406" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>The same tool designed two ways</title>
  <desc>Two columns with four rows each: name, parameters, result and error. Left column, wraps the endpoint: it is called get_tasks, takes id, f and n without saying of what, returns every row with internal ids, and its error is 400 Bad Request. Right column, built for the task: it is called find_overdue_tasks, takes project_id and days_overdue with a unit and an example, returns 20 rows, the total and how to ask for the next ones, and its error says project_id was not found and to use find_projects. Illustrative example, not measured data.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="406" fill="#FAFAF5" />
  <rect x="20" y="20" width="275" height="38" fill="#F0EFE8" />
  <rect x="305" y="20" width="275" height="38" fill="#F0EFE8" />

  <!-- Row separators, recessive -->
  <line x1="20" y1="140" x2="295" y2="140" stroke="#D0CFC8" stroke-width="2" />
  <line x1="20" y1="222" x2="295" y2="222" stroke="#D0CFC8" stroke-width="2" />
  <line x1="20" y1="304" x2="295" y2="304" stroke="#D0CFC8" stroke-width="2" />
  <line x1="305" y1="140" x2="580" y2="140" stroke="#D0CFC8" stroke-width="2" />
  <line x1="305" y1="222" x2="580" y2="222" stroke="#D0CFC8" stroke-width="2" />
  <line x1="305" y1="304" x2="580" y2="304" stroke="#D0CFC8" stroke-width="2" />

  <rect x="20" y="20" width="275" height="366" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <line x1="20" y1="58" x2="295" y2="58" stroke="#1A1A1A" stroke-width="2" />
  <!-- Right column is identified by its header text, not only by the accent border. -->
  <rect x="305" y="20" width="275" height="366" fill="none" stroke="#C41E1E" stroke-width="2" />
  <line x1="305" y1="58" x2="580" y2="58" stroke="#C41E1E" stroke-width="2" />

  <text x="32" y="44" font-size="14" font-weight="700" fill="#1A1A1A">WRAPS THE ENDPOINT</text>
  <text x="317" y="44" font-size="14" font-weight="700" fill="#C41E1E">BUILT FOR THE TASK</text>

  <!-- Name -->
  <text x="32" y="82" font-size="14" font-weight="700" fill="#6B6B6B">NAME</text>
  <text x="32" y="106" font-size="14" fill="#1A1A1A">get_tasks</text>
  <text x="317" y="82" font-size="14" font-weight="700" fill="#6B6B6B">NAME</text>
  <text x="317" y="106" font-size="14" fill="#1A1A1A">find_overdue_tasks</text>

  <!-- Parameters -->
  <text x="32" y="164" font-size="14" font-weight="700" fill="#6B6B6B">PARAMETERS</text>
  <text x="32" y="188" font-size="14" fill="#1A1A1A">id, f, n</text>
  <text x="32" y="208" font-size="14" fill="#4A4A4A">id of what?</text>
  <text x="317" y="164" font-size="14" font-weight="700" fill="#6B6B6B">PARAMETERS</text>
  <text x="317" y="188" font-size="14" fill="#1A1A1A">project_id, days_overdue</text>
  <text x="317" y="208" font-size="14" fill="#4A4A4A">with unit and example</text>

  <!-- Result -->
  <text x="32" y="246" font-size="14" font-weight="700" fill="#6B6B6B">RESULT</text>
  <text x="32" y="270" font-size="14" fill="#1A1A1A">every row,</text>
  <text x="32" y="290" font-size="14" fill="#1A1A1A">internal ids</text>
  <text x="317" y="246" font-size="14" font-weight="700" fill="#6B6B6B">RESULT</text>
  <text x="317" y="270" font-size="14" fill="#1A1A1A">20 rows, the total, and</text>
  <text x="317" y="290" font-size="14" fill="#1A1A1A">how to ask for the next</text>

  <!-- Error -->
  <text x="32" y="328" font-size="14" font-weight="700" fill="#6B6B6B">ERROR</text>
  <text x="32" y="352" font-size="14" fill="#1A1A1A">400 Bad Request</text>
  <text x="317" y="328" font-size="14" font-weight="700" fill="#6B6B6B">ERROR</text>
  <text x="317" y="352" font-size="14" fill="#1A1A1A">project_id not found;</text>
  <text x="317" y="372" font-size="14" fill="#1A1A1A">use find_projects</text>
</svg>
