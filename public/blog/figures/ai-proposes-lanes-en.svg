<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Two lanes: the model proposes and a transaction decides</title>
  <desc>Conceptual sketch, not measured data. Left lane, the model: written requirement, model, schema validation and a pending proposal; its authority ends there and it never reaches the data. A dashed line carries the proposal to the right lane, the deterministic one: a person confirms, the guards check permission, state and expiry, the commit writes all or nothing, a record of the decision is kept, and only then is the product data reached.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="460" fill="#FAFAF5" />

  <!-- Lane headers -->
  <text x="150" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">THE MODEL PROPOSES</text>
  <text x="450" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">A TRANSACTION DECIDES</text>
  <line x1="35" y1="50" x2="265" y2="50" stroke="#D0CFC8" stroke-width="2" />
  <line x1="335" y1="50" x2="565" y2="50" stroke="#D0CFC8" stroke-width="2" />

  <!-- Model lane: ends at the proposal. -->
  <rect x="35" y="72" width="230" height="52" fill="none" stroke="#4A4A4A" stroke-width="2" />
  <text x="150" y="103" text-anchor="middle" font-size="14" fill="#1A1A1A">written requirement</text>
  <line x1="150" y1="124" x2="150" y2="142" stroke="#4A4A4A" stroke-width="2" />
  <polygon points="150,150 144,140 156,140" fill="#4A4A4A" />

  <rect x="35" y="150" width="230" height="52" fill="none" stroke="#4A4A4A" stroke-width="2" />
  <text x="150" y="181" text-anchor="middle" font-size="14" fill="#1A1A1A">model</text>
  <line x1="150" y1="202" x2="150" y2="220" stroke="#4A4A4A" stroke-width="2" />
  <polygon points="150,228 144,218 156,218" fill="#4A4A4A" />

  <rect x="35" y="228" width="230" height="52" fill="none" stroke="#4A4A4A" stroke-width="2" />
  <text x="150" y="259" text-anchor="middle" font-size="14" fill="#1A1A1A">schema validation</text>
  <line x1="150" y1="280" x2="150" y2="298" stroke="#4A4A4A" stroke-width="2" />
  <polygon points="150,306 144,296 156,296" fill="#4A4A4A" />

  <rect x="35" y="306" width="230" height="52" fill="#F0EFE8" stroke="#1A1A1A" stroke-width="2" />
  <text x="150" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">PROPOSAL</text>
  <text x="150" y="348" text-anchor="middle" font-size="14" fill="#4A4A4A">pending</text>

  <!-- Dead end: the model lane never reaches the data. -->
  <line x1="150" y1="358" x2="150" y2="376" stroke="#C41E1E" stroke-width="2" />
  <line x1="110" y1="376" x2="190" y2="376" stroke="#C41E1E" stroke-width="2" />
  <text x="150" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#C41E1E">its authority ends here</text>

  <!-- The proposal waits until a person picks it up. -->
  <polyline points="265,332 300,332 300,98 327,98" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6 4" />
  <polygon points="335,98 325,92 325,104" fill="#1A1A1A" />

  <!-- Deterministic lane: the only one that reaches the data. -->
  <rect x="335" y="72" width="230" height="52" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="450" y="103" text-anchor="middle" font-size="14" fill="#1A1A1A">a person confirms</text>
  <line x1="450" y1="124" x2="450" y2="142" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="450,150 444,140 456,140" fill="#1A1A1A" />

  <rect x="335" y="150" width="230" height="52" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="450" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1A1A">guards</text>
  <text x="450" y="192" text-anchor="middle" font-size="14" fill="#4A4A4A">permission, state, expiry</text>
  <line x1="450" y1="202" x2="450" y2="220" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="450,228 444,218 456,218" fill="#1A1A1A" />

  <rect x="335" y="228" width="230" height="52" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="450" y="259" text-anchor="middle" font-size="14" fill="#1A1A1A">commit: all or nothing</text>
  <line x1="450" y1="280" x2="450" y2="298" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="450,306 444,296 456,296" fill="#1A1A1A" />

  <rect x="335" y="306" width="230" height="52" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <text x="450" y="337" text-anchor="middle" font-size="14" fill="#1A1A1A">record of the decision</text>
  <line x1="450" y1="358" x2="450" y2="376" stroke="#1A1A1A" stroke-width="2" />
  <polygon points="450,384 444,374 456,374" fill="#1A1A1A" />

  <rect x="335" y="384" width="230" height="48" fill="#1A1A1A" />
  <text x="450" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#FAFAF5">PRODUCT DATA</text>
</svg>
