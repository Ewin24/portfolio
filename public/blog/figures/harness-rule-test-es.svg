<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">
  <title>Matriz conceptual: qué hacer con cada regla del arnés</title>
  <desc>Cuadrícula de dos por dos. Eje vertical: si la regla nació de un fallo real, sí arriba y no abajo. Eje horizontal: si algo puede comprobarla, sí a la izquierda y no a la derecha. Con fallo y comprobable: se queda. Con fallo y sin comprobación: volverla prueba, porque se lee y se ignora. Sin fallo y comprobable: a prueba. Sin fallo y sin comprobación: borrar. Esquema conceptual, no datos medidos.</desc>

  <!-- Colors are the newspaper tokens from src/index.css; an <img> cannot read CSS variables. -->
  <rect width="600" height="450" fill="#FAFAF5" />

  <!-- Highlighted cell: came from a failure, nothing checks it. Identified by its tag text, not only by color. -->
  <rect x="335" y="30" width="245" height="170" fill="#F0EFE8" />

  <rect x="90" y="30" width="490" height="340" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <line x1="335" y1="30" x2="335" y2="370" stroke="#1A1A1A" stroke-width="2" />
  <line x1="90" y1="200" x2="580" y2="200" stroke="#1A1A1A" stroke-width="2" />
  <rect x="339" y="34" width="237" height="162" fill="none" stroke="#C41E1E" stroke-width="2" />

  <!-- Vertical axis -->
  <text transform="translate(28 200) rotate(-90)" text-anchor="middle" font-size="14" fill="#1A1A1A">¿nació de un fallo real?</text>
  <text transform="translate(68 115) rotate(-90)" text-anchor="middle" font-size="14" fill="#6B6B6B">sí</text>
  <text transform="translate(68 285) rotate(-90)" text-anchor="middle" font-size="14" fill="#6B6B6B">no</text>

  <!-- Horizontal axis -->
  <text x="212" y="394" text-anchor="middle" font-size="14" fill="#6B6B6B">sí</text>
  <text x="457" y="394" text-anchor="middle" font-size="14" fill="#6B6B6B">no</text>
  <text x="335" y="428" text-anchor="middle" font-size="14" fill="#1A1A1A">¿algo puede comprobarla?</text>

  <!-- Top left: from a failure, checkable -->
  <text x="106" y="70" font-size="16" font-weight="700" fill="#1A1A1A">1. SE QUEDA</text>
  <text x="106" y="102" font-size="14" fill="#4A4A4A">Tiene causa y algo</text>
  <text x="106" y="122" font-size="14" fill="#4A4A4A">la hace cumplir.</text>

  <!-- Top right: from a failure, not checkable -->
  <text x="355" y="70" font-size="16" font-weight="700" fill="#1A1A1A">2. VOLVERLA PRUEBA</text>
  <text x="355" y="102" font-size="14" fill="#4A4A4A">Si nada la comprueba,</text>
  <text x="355" y="122" font-size="14" fill="#4A4A4A">queda de adorno.</text>
  <text x="355" y="170" font-size="14" font-weight="700" fill="#C41E1E">se lee y se ignora</text>

  <!-- Bottom left: no known failure, checkable -->
  <text x="106" y="240" font-size="16" font-weight="700" fill="#1A1A1A">3. A PRUEBA</text>
  <text x="106" y="272" font-size="14" fill="#4A4A4A">Si nunca bloquea</text>
  <text x="106" y="292" font-size="14" fill="#4A4A4A">nada, sobra.</text>

  <!-- Bottom right: no known failure, not checkable -->
  <text x="355" y="240" font-size="16" font-weight="700" fill="#1A1A1A">4. BORRAR</text>
  <text x="355" y="272" font-size="14" fill="#4A4A4A">Ceremonia: cuesta</text>
  <text x="355" y="292" font-size="14" fill="#4A4A4A">y no protege.</text>
</svg>
