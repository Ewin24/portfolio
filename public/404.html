<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Edwin Trigos - Full Stack Developer Portfolio. Projects, skills, and experience pulled automatically from GitHub." />
  <meta property="og:title" content="Edwin Trigos | Full Stack Developer" />
  <meta property="og:description" content="Personal portfolio with live GitHub integration" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Edwin Trigos | Full Stack Developer</title>
  <script>
    // SPA fallback for a hash-routed app (#blog/article/<slug>): any unknown path
    // goes back to the site root, keeping the hash. The root is /portfolio/ on
    // GitHub Pages and / on Vercel. Never redirect when already at the root,
    // or a missing index would reload forever.
    var l = window.location;
    var root = l.pathname.indexOf('/portfolio') === 0 ? '/portfolio/' : '/';
    if (l.pathname !== root) l.replace(l.origin + root + l.hash);
  </script>
</head>
<body>
  <noscript>
    <p>Redirecting to <a href="./">Edwin Trigos Portfolio</a>...</p>
  </noscript>
</body>
</html>
